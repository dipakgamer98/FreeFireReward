<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garena Free Fire Team</title>
    <style>
        body {
            background-color: #222;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            background-color: #4fe3ff;
            width: 100%;
            text-align: center;
            padding: 18px;
            font-size: 26px;
            font-weight: bold;
            color: white;
        }
        .container {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            align-items: center;
            width: 100%;
            max-width: 400px;
        }
        .video-section {
            width: 100%;
            border-radius: 15px;
            overflow: hidden;
            background-color: #000;
            position: relative;
            cursor: pointer;
        }
        .video-section video {
            width: 100%;
            height: auto;
            display: block;
        }
        /* Custom Play Overlay Button */
        .play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.3s ease;
        }
        .play-btn-icon {
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0px 0px 25px rgba(255, 255, 255, 0.6);
        }
        .play-btn-icon::after {
            content: "";
            width: 0;
            height: 0;
            border-top: 14px solid transparent;
            border-bottom: 14px solid transparent;
            border-left: 22px solid #000;
            margin-left: 4px;
        }
        .neon-border-wrapper {
            padding: 3px;
            border-radius: 20px;
            background: linear-gradient(45deg, red, orange, yellow, green, blue, indigo, violet);
            width: 100%;
        }
        .offer-card {
            background-color: #1a1a1a;
            border-radius: 18px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .offer-content {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 100%;
            margin-bottom: 15px;
            text-align: left;
        }
        .offer-content img {
            width: 75px;
            height: 75px;
            border-radius: 12px;
            object-fit: cover;
        }
        .offer-text h2 {
            font-size: 18px;
            margin: 0 0 5px 0;
            color: white;
        }
        .offer-text p {
            font-size: 13px;
            margin: 0;
            color: #ccc;
        }
        .stars {
            color: #ffd700;
            font-size: 20px;
            margin-bottom: 15px;
        }
        .install-btn {
            background-color: #00c853;
            color: white;
            text-align: center;
            padding: 14px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            display: block;
            width: 100%;
            box-shadow: 0px 4px 10px rgba(0, 200, 83, 0.4);
        }
    </style>
</head>
<body>

    <div class="header">Garena Free Fire Team</div>

    <div class="container">
        <div class="video-section" id="videoContainer">
            <video id="myVideo" playsinline>
                <source src="video-1787804775854.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
            <div class="play-overlay" id="playOverlay">
                <div class="play-btn-icon"></div>
            </div>
        </div>

        <div class="neon-border-wrapper">
            <div class="offer-card">
                <div class="offer-content">
                    <img src="Picsart_26-09-01_08-41-45-346.jpg" alt="Diamond">
                    <div class="offer-text">
                        <h2>FREE DIAMONDS CLAIM</h2>
                        <p>FREE 10000 DIAMONDS CLAIM 💎🥳</p>
                    </div>
                </div>
                <div class="stars">★★★★★</div>
                <a href="https://1024terabox.com/s/1ilwOZClB_bSnu-ZUcJ2avg" class="install-btn">CLAIM NOW</a>
            </div>
        </div>
    </div>

    <script>
        const videoContainer = document.getElementById('videoContainer');
        const video = document.getElementById('myVideo');
        const playOverlay = document.getElementById('playOverlay');

        videoContainer.addEventListener('click', function() {
            if (video.paused) {
                video.muted = false; // Aawaz on kar di
                video.play();        // Video chalu kar di
                playOverlay.style.display = 'none'; // Play button gayab ho jayega
                video.controls = true; // Video controls show ho jayenge
            }
        });
    </script>

</body>
</html>
