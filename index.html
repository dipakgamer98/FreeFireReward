<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garena Free Fire Team - Rewards</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
        }
        .header {
            background-color: #00e5ff;
            color: #121212;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
        }
        .container {
            padding: 15px;
            max-width: 500px;
            margin: 0 auto;
        }
        .video-container {
            position: relative;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
            background: #000;
        }
        .video-container video {
            width: 100%;
            display: block;
        }
        .play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.3);
            cursor: pointer;
        }
        .play-btn-icon {
            width: 60px;
            height: 60px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .play-btn-icon::after {
            content: '';
            display: block;
            width: 0;
            height: 0;
            border-top: 12px solid transparent;
            border-bottom: 12px solid transparent;
            border-left: 20px solid #121212;
            margin-left: 4px;
        }
        .neon-border-wrapper {
            padding: 3px;
            border-radius: 16px;
            background: linear-gradient(45deg, red, orange, yellow, green, cyan, blue, violet);
            margin-bottom: 20px;
        }
        .offer-card {
            background-color: #1a1a1a;
            border-radius: 14px;
            overflow: hidden;
            padding-bottom: 15px;
        }
        .offer-card img {
            width: 100%;
            display: block;
            border-top-left-radius: 14px;
            border-top-right-radius: 14px;
        }
        .offer-content {
            padding: 10px;
        }
        .offer-content h2 {
            font-size: 18px;
            margin: 0 0 5px 0;
            color: white;
        }
        .offer-content p {
            font-size: 13px;
            margin: 0;
            color: #ccc;
        }
        .stars {
            color: #ffd700;
            font-size: 20px;
            margin-bottom: 15px;
        }
        .install-btn {
            background-color: #00c853;
            color: white;
            text-align: center;
            padding: 14px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            display: block;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 4px 10px rgba(0, 200, 83, 0.4);
        }
    </style>
</head>
<body>

    <div class="header">Garena Free Fire Team</div>

    <div class="container">
        <div class="video-container" id="videoContainer">
            <video id="myVideo" playsinline>
                <source src="video-1787804775854.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
            <div class="play-overlay" id="playOverlay">
                <div class="play-btn-icon"></div>
            </div>
        </div>

        <div class="neon-border-wrapper">
            <div class="offer-card">
                <img src="image_search_1788236237970.jpg" alt="Free Fire Diamonds">
                <div class="offer-content">
                    <h2>FREE DIAMONDS CLAIM</h2>
                    <p>FREE 10000 DIAMONDS CLAIM 💎🥳</p>
                </div>
            </div>
        </div>

        <div class="stars">★★★★★</div>

        <a href="https://1024terabox.com/s/1xx-pXgmEp-vZ8ANJhwVJQ" class="install-btn">CLAIM 1000 DIAMOND 💎</a>
    </div>

    <script>
        const video = document.getElementById('myVideo');
        const playOverlay = document.getElementById('playOverlay');

        playOverlay.addEventListener('click', function() {
            if (video.paused) {
                video.play();
                playOverlay.style.display = 'none';
            } else {
                video.pause();
                playOverlay.style.display = 'flex';
            }
        });

        video.addEventListener('ended', function() {
            playOverlay.style.display = 'flex';
        });
    </script>

</body>
</html>
