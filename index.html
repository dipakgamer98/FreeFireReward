<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garena Free Fire Team</title>
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 30px;
        }
        .top-bar {
            background-color: #00e5ff;
            color: #000;
            width: 100%;
            text-align: center;
            padding: 14px 0;
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .video-container {
            width: 96%;
            max-width: 480px;
            background-color: #1a1a1a;
            border: 2px solid #333;
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 18px;
            cursor: pointer;
        }
        .video-container video {
            width: 100%;
            display: block;
        }
        .reward-card {
            background: linear-gradient(135deg, #1a1a1a, #262626);
            border: 2px solid;
            border-image: linear-gradient(45deg, #ff007f, #00ffff, #ffcc00) 1;
            border-radius: 14px;
            width: 96%;
            max-width: 480px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 22px;
            box-sizing: border-box;
        }
        .reward-img {
            width: 75px;
            height: 75px;
            border-radius: 10px;
            object-fit: cover;
            background-color: #000;
        }
        .reward-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .reward-title {
            font-size: 16px;
            font-weight: bold;
            color: white;
            margin: 0;
        }
        .reward-desc {
            font-size: 11px;
            color: #aaa;
            margin: 0;
            line-height: 1.4;
        }
        .stars {
            color: #ffc107;
            font-size: 13px;
        }
        .claim-btn {
            background-color: #00e676;
            color: #000;
            text-align: center;
            padding: 16px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            display: block;
            width: 96%;
            max-width: 480px;
            box-shadow: 0px 4px 18px rgba(0, 230, 118, 0.4);
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="top-bar">Garena Free Fire Team</div>

    <div class="video-container" onclick="toggleVideo()">
        <video id="myVideo" autoplay muted loop playsinline>
            <source src="https://raw.githubusercontent.com/dipakgamer98/FreeFireReward/main/video-1787804775854.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <div class="reward-card">
        <img src="https://raw.githubusercontent.com/dipakgamer98/FreeFireReward/main/image_search_1788236237970.jpg" class="reward-img" alt="Diamond">
        <div class="reward-info">
            <h3 class="reward-title">FREE DIAMONDS CLAIM</h3>
            <p class="reward-desc">FREE 10000 DIAMONDS CLAIM 💎🥳</p>
            <div class="stars">★★★★★</div>
        </div>
    </div>

    <a href="https://1024terabox.com/s/1Po9NS3IRCASNtAWaJ2lUTA" class="claim-btn">CLAIM NOW</a>

    <script>
        function toggleVideo() {
            var vid = document.getElementById("myVideo");
            if (vid.muted) {
                vid.muted = false;
                vid.play();
            } else if (vid.paused) {
                vid.play();
            } else {
                vid.pause();
            }
        }
    </script>

</body>
</html>
