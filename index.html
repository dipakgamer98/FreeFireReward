<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garena Free Fire Team</title>
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 40px;
        }
        .top-bar {
            background-color: #00e5ff;
            color: #000;
            width: 100%;
            text-align: center;
            padding: 16px 0;
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 18px;
        }
        .watch-title {
            color: white;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 18px;
            text-align: center;
        }
        .video-container {
            width: 96%;
            max-width: 500px;
            background-color: #1a1a1a;
            border: 2px solid #333;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 22px;
            position: relative;
            cursor: pointer;
        }
        .video-container video {
            width: 100%;
            display: block;
        }
        .custom-play-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 75px;
            height: 75px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            pointer-events: none;
        }
        .custom-play-btn::after {
            content: "";
            position: relative;
            left: 3px;
            width: 0;
            height: 0;
            border-top: 15px solid transparent;
            border-bottom: 15px solid transparent;
            border-left: 24px solid #121212;
        }
        .reward-card {
            background: linear-gradient(135deg, #1a1a1a, #262626);
            border: 2px solid;
            border-image: linear-gradient(45deg, #ff007f, #00ffff, #ffcc00) 1;
            border-radius: 16px;
            width: 96%;
            max-width: 500px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-sizing: border-box;
        }
        .reward-top {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .reward-img {
            width: 65px;
            height: 65px;
            border-radius: 10px;
            object-fit: cover;
            background-color: #000;
        }
        .reward-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .reward-title {
            font-size: 16px;
            font-weight: bold;
            color: white;
            margin: 0;
        }
        .reward-desc {
            font-size: 11px;
            color: #aaa;
            margin: 0;
        }
        .stars {
            color: #ffc107;
            font-size: 13px;
        }
        .claim-btn {
            background-color: #00e676;
            color: #000;
            text-align: center;
            padding: 15px;
            border-radius: 25px;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            display: block;
            width: 100%;
            box-shadow: 0px 4px 15px rgba(0, 230, 118, 0.4);
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="top-bar">Garena Free Fire Team</div>

    <div class="watch-title">WATCH FULL VIDEO</div>

    <div class="video-container" id="videoBox" onclick="playVideo()">
        <video id="myVideo" playsinline loop>
            <source src="https://raw.githubusercontent.com/dipakgamer98/FreeFireReward/main/video-1787804775854.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <div class="custom-play-btn" id="playBtn"></div>
    </div>

    <div class="reward-card">
        <div class="reward-top">
            <img src="https://raw.githubusercontent.com/dipakgamer98/FreeFireReward/main/image_search_1788236237970.jpg" class="reward-img" alt="Diamond">
            <div class="reward-info">
                <h3 class="reward-title">FREE DIAMONDS CLAIM</h3>
                <p class="reward-desc">FREE 10000 DIAMONDS CLAIM 💎🥳</p>
                <div class="stars">★★★★★</div>
            </div>
        </div>
        <a href="https://1024terabox.com/s/1Po9NS3IRCASNtAWaJ2lUTA" class="claim-btn">CLAIM FREE DIAMOND 💎</a>
    </div>

    <script>
        function playVideo() {
            var vid = document.getElementById("myVideo");
            var btn = document.getElementById("playBtn");
            if (vid.paused) {
                vid.muted = false;
                vid.play();
                vid.controls = true;
                btn.style.display = "none";
            } else {
                vid.pause();
                btn.style.display = "flex";
            }
        }
    </script>

</body>
</html>
