<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garena Free Fire Team</title>
    <style>
        body {
            background-color: #222;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            background-color: #4fe3ff;
            width: 100%;
            text-align: center;
            padding: 18px;
            font-size: 26px;
            font-weight: bold;
            color: white;
        }
        .container {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            align-items: center;
            width: 100%;
            max-width: 400px;
        }
        .video-section {
            width: 100%;
            border-radius: 15px;
            overflow: hidden;
            background-color: #000;
        }
        .video-section video {
            width: 100%;
            height: auto;
            display: block;
        }
        .neon-border-wrapper {
            padding: 3px;
            border-radius: 20px;
            background: linear-gradient(45deg, red, orange, yellow, green, blue, indigo, violet);
            width: 100%;
        }
        .offer-card {
            background-color: #1a1a1a;
            border-radius: 18px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .offer-content {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 100%;
            margin-bottom: 15px;
            text-align: left;
        }
        .offer-content img {
            width: 75px;
            height: 75px;
            border-radius: 12px;
            object-fit: cover;
        }
        .offer-text h2 {
            font-size: 18px;
            margin: 0 0 5px 0;
            color: white;
        }
        .offer-text p {
            font-size: 13px;
            margin: 0;
            color: #ccc;
        }
        .stars {
            color: #ffd700;
            font-size: 20px;
            margin-bottom: 15px;
        }
        .install-btn {
            background-color: #00e676;
            color: white;
            text-align: center;
            padding: 14px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            display: block;
            width: 100%;
            box-shadow: 0px 4px 10px rgba(0, 230, 118, 0.4);
        }
    </style>
</head>
<body>

    <div class="header">Garena Free Fire Team</div>

    <div class="container">
        <!-- Direct Video Player -->
        <div class="video-section">
            <video id="myVideo" autoplay muted loop playsinline>
                <source src="video-1787804775854.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>

        <!-- Neon Offer Card with Diamond Image and TeraBox Link -->
        <div class="neon-border-wrapper">
            <div class="offer-card">
                <div class="offer-content">
                    <img src="image_search_1787926038962.jpg" alt="Diamond">
                    <div class="offer-text">
                        <h2>Free Unlimited Daimonds</h2>
                        <p>CLAIM FREE Daimonds</p>
                    </div>
                </div>
                <div class="stars">★★★★★</div>
                <a href="https://1024terabox.com/s/1ilwOZClB_bSnu-ZUcJ2avg" class="install-btn">Install</a>
            </div>
        </div>
    </div>

    <script>
        // Jaise hi user screen par kahin bhi pehli baar tap/click karega, aawaz on ho jayegi
        window.addEventListener('click', function() {
            var v = document.getElementById('myVideo');
            if (v) {
                v.muted = false;
                v.play();
            }
        }, { once: true });
    </script>

</body>
</html>
