<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garena Free Fire Team</title>
    <style>
        body { 
            background-color: #252525; 
            color: white; 
            font-family: Arial, sans-serif; 
            margin: 0; 
        }
        .header { 
            background-color: #63d6ff; 
            text-align: center; 
            padding: 20px; 
            font-size: 28px; 
            font-weight: bold; 
        }
        .container { 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 30px; 
            align-items: center; 
        }
        .video-section { 
            width: 100%; 
            max-width: 450px; 
            border-radius: 15px; 
            overflow: hidden; 
            background-color: #000;
        }
        video { 
            width: 100%; 
            display: block; 
        }
        /* Neon Rainbow Border Effect */
        .neon-border-wrapper {
            background: linear-gradient(90deg, red, orange, yellow, green, cyan, blue, purple, red);
            padding: 3px;
            border-radius: 18px;
            width: 100%;
            max-width: 450px;
        }
        .offer-card { 
            background-color: #1a1a1a; 
            padding: 20px; 
            border-radius: 15px; 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
        }
        .offer-top { 
            display: flex; 
            gap: 15px; 
            align-items: center; 
        }
        .app-icon { 
            width: 80px; 
            height: 80px; 
            border-radius: 15px; 
            object-fit: cover;
        }
        .offer-text h2 { 
            margin: 0; 
            font-size: 22px; 
        }
        .offer-text p { 
            margin: 5px 0 0; 
            color: #ccc; 
            font-size: 14px; 
            text-transform: uppercase;
        }
        .stars { 
            color: #ffd700; 
            font-size: 22px; 
            margin-top: 5px;
        }
        .install-btn { 
            background-color: #00e676; 
            color: white; 
            text-align: center; 
            padding: 15px; 
            border-radius: 30px; 
            text-decoration: none; 
            font-size: 20px; 
            font-weight: bold; 
            display: block; 
        }
    </style>
</head>
<body>

<div class="header">Garena Free Fire Team</div>

<div class="container">
    <!-- Video Player -->
    <div class="video-section">
        <video controls poster="your-thumbnail-image.jpg">
            <!-- Yahan apni video ka link daalein -->
            <source src="your-gameplay-video.mp4" type="video/mp4">
        </video>
    </div>

    <!-- App Install Box -->
    <div class="neon-border-wrapper">
        <div class="offer-card">
            <div class="offer-top">
                <!-- Yahan diamond icon image ka link daalein -->
                <img src="diamond-icon.jpg" alt="Free Fire Diamonds" class="app-icon">
                <div class="offer-text">
                    <h2>Free Unlimited Daimonds</h2>
                    <p>CLAIM FREE Daimonds</p>
                    <div class="stars">★★★★★</div>
                </div>
            </div>
            <!-- Yahan # ki jagah apna target link daalein -->
            <a href="#" class="install-btn">Install</a>
        </div>
    </div>
</div>

</body>
</html>
